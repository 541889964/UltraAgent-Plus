name: Build UltraAgent
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Find gradlew
        run: find . -name gradlew -type f | head -5
      - name: Build
        run: |
          DIR=$(dirname $(find . -name gradlew -type f | head -1))
          echo "项目目录: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        if: always()
        run: |
          mkdir -p release
          find . -name "*.apk" -exec cp {} release/ \; 2>/dev/null || true
          ls -lh release/
      - uses: softprops/action-gh-release@v2
        if: hashFiles('release/*') != ''
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: release/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
